version: '3.8'

services:
  geoguard-db:
    image: postgis/postgis:16-3.4
    container_name: geoguard-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
