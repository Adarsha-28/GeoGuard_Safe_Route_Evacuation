version: '3.8'

services:
  geoguard-db:
    image: postgis/postgis:16-3.4
    container_name: geoguard-postgis
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoguard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-geoguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  geoguard-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoguard-app
    restart: always
    depends_on:
      geoguard-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@geoguard-db:5432/${POSTGRES_DB:-geoguard}"
      DEBUG: "False"
      OSRM_URL: "https://router.project-osrm.org"
      OPENMETEO_BASE_URL: "https://api.open-meteo.com/v1/forecast"

volumes:
  postgis_data:
